<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="900" viewBox="0 0 1060 900" font-family="Meiryo, sans-serif">
  <rect width="1060" height="900" fill="#fbfbfd"/>
  <text x="530" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">ROGII: このコンペの正しいCV構造と、私が踏んだリークの罠</text>

  <!-- ===== (1) データ構造 ===== -->
  <text x="30" y="72" font-size="17" font-weight="bold" fill="#0b5">① データ構造：test は「新field」ではなく、train と空間ランダムに混在</text>
  <rect x="30" y="84" width="1000" height="150" rx="8" fill="#ffffff" stroke="#ccd" />
  <!-- scatter region -->
  <g>
    <!-- train dots (blue) and test dots (orange) interspersed -->
    <g fill="#3a7bd5">
      <circle cx="120" cy="150" r="4"/><circle cx="160" cy="120" r="4"/><circle cx="200" cy="170" r="4"/>
      <circle cx="250" cy="130" r="4"/><circle cx="300" cy="190" r="4"/><circle cx="350" cy="140" r="4"/>
      <circle cx="410" cy="115" r="4"/><circle cx="470" cy="175" r="4"/><circle cx="540" cy="135" r="4"/>
      <circle cx="600" cy="195" r="4"/><circle cx="660" cy="150" r="4"/><circle cx="720" cy="120" r="4"/>
      <circle cx="780" cy="180" r="4"/><circle cx="840" cy="140" r="4"/><circle cx="900" cy="165" r="4"/>
      <circle cx="140" cy="200" r="4"/><circle cx="230" cy="205" r="4"/><circle cx="330" cy="110" r="4"/>
      <circle cx="500" cy="205" r="4"/><circle cx="640" cy="110" r="4"/><circle cx="760" cy="205" r="4"/><circle cx="870" cy="200" r="4"/>
    </g>
    <g fill="#f5871f">
      <circle cx="180" cy="145" r="4.5"/><circle cx="280" cy="160" r="4.5"/><circle cx="390" cy="150" r="4.5"/>
      <circle cx="520" cy="170" r="4.5"/><circle cx="620" cy="145" r="4.5"/><circle cx="700" cy="170" r="4.5"/>
      <circle cx="810" cy="120" r="4.5"/><circle cx="440" cy="200" r="4.5"/><circle cx="580" cy="115" r="4.5"/>
    </g>
  </g>
  <rect x="930" y="100" width="14" height="14" fill="#3a7bd5"/><text x="950" y="112" font-size="13" fill="#333">train (773, ラベル有)</text>
  <rect x="930" y="122" width="14" height="14" fill="#f5871f"/><text x="950" y="134" font-size="13" fill="#333">test (~200, ラベル無)</text>
  <text x="950" y="160" font-size="12" fill="#888">↑ ランダムに</text><text x="950" y="176" font-size="12" fill="#888">  混在している</text>
  <text x="45" y="225" font-size="13" fill="#c0392b" font-weight="bold">→ test は同じ母集団からランダム抽出。「別の場所(新field)」ではない</text>

  <!-- ===== (2) 正しいCV ===== -->
  <text x="30" y="272" font-size="17" font-weight="bold" fill="#0b5">② だから正しいCVは「ランダム/well 分割」。field-out は誤り</text>

  <!-- 誤: field-out -->
  <rect x="30" y="286" width="490" height="180" rx="8" fill="#fff5f5" stroke="#e88"/>
  <text x="45" y="310" font-size="15" font-weight="bold" fill="#c0392b">✗ field-out（私がやった誤り）</text>
  <text x="45" y="332" font-size="12.5" fill="#555">field(空間クラスタ)を丸ごと val にする</text>
  <!-- mini map -->
  <g transform="translate(60,345)">
    <circle cx="20" cy="30" r="5" fill="#f5871f"/><circle cx="40" cy="20" r="5" fill="#f5871f"/><circle cx="35" cy="48" r="5" fill="#f5871f"/><circle cx="15" cy="55" r="5" fill="#f5871f"/>
    <circle cx="150" cy="30" r="5" fill="#3a7bd5"/><circle cx="170" cy="20" r="5" fill="#3a7bd5"/><circle cx="165" cy="48" r="5" fill="#3a7bd5"/><circle cx="185" cy="40" r="5" fill="#3a7bd5"/>
    <text x="10" y="80" font-size="11" fill="#c0392b">val=この塊全部</text>
    <text x="140" y="80" font-size="11" fill="#3a7bd5">train=別の塊</text>
  </g>
  <text x="45" y="440" font-size="12.5" fill="#c0392b">test は新fieldでないのに「field欠損」を課す＝過剰に悲観</text>
  <text x="45" y="458" font-size="12.5" fill="#c0392b">→ この競技では間違ったCV</text>

  <!-- 正: random -->
  <rect x="540" y="286" width="490" height="180" rx="8" fill="#f2fbf5" stroke="#8c8"/>
  <text x="555" y="310" font-size="15" font-weight="bold" fill="#0a7d3a">✓ ランダム/well 分割（正しい）</text>
  <text x="555" y="332" font-size="12.5" fill="#555">井を無作為に5分割。val fold = test の代役</text>
  <g transform="translate(570,345)">
    <circle cx="20" cy="30" r="5" fill="#f5871f"/><circle cx="55" cy="22" r="5" fill="#3a7bd5"/><circle cx="90" cy="45" r="5" fill="#f5871f"/><circle cx="125" cy="25" r="5" fill="#3a7bd5"/>
    <circle cx="160" cy="48" r="5" fill="#3a7bd5"/><circle cx="195" cy="30" r="5" fill="#f5871f"/><circle cx="230" cy="50" r="5" fill="#3a7bd5"/><circle cx="265" cy="22" r="5" fill="#3a7bd5"/>
    <circle cx="40" cy="60" r="5" fill="#3a7bd5"/><circle cx="110" cy="65" r="5" fill="#f5871f"/><circle cx="210" cy="65" r="5" fill="#3a7bd5"/>
    <text x="10" y="95" font-size="11" fill="#0a7d3a">val(橙)と train(青)が混在＝test と同じ状況</text>
  </g>
  <text x="555" y="458" font-size="12.5" fill="#0a7d3a">→ val=test。OOF がそのまま test 推定になる</text>

  <!-- ===== (3) clean評価パイプライン ===== -->
  <text x="30" y="512" font-size="17" font-weight="bold" fill="#0b5">③ clean 5-fold：val の情報（ラベルも weight 選択も）を一切入れない</text>
  <rect x="30" y="526" width="1000" height="130" rx="8" fill="#ffffff" stroke="#ccd"/>
  <!-- 4 train folds + 1 val -->
  <g transform="translate(55,548)">
    <rect x="0" y="0" width="120" height="40" rx="5" fill="#dbe9ff" stroke="#3a7bd5"/><text x="60" y="24" text-anchor="middle" font-size="12" fill="#26527d">train fold1</text>
    <rect x="130" y="0" width="120" height="40" rx="5" fill="#dbe9ff" stroke="#3a7bd5"/><text x="190" y="24" text-anchor="middle" font-size="12" fill="#26527d">train fold2</text>
    <rect x="260" y="0" width="120" height="40" rx="5" fill="#dbe9ff" stroke="#3a7bd5"/><text x="320" y="24" text-anchor="middle" font-size="12" fill="#26527d">train fold3</text>
    <rect x="390" y="0" width="120" height="40" rx="5" fill="#dbe9ff" stroke="#3a7bd5"/><text x="450" y="24" text-anchor="middle" font-size="12" fill="#26527d">train fold4</text>
    <rect x="540" y="0" width="130" height="40" rx="5" fill="#ffe6cc" stroke="#f5871f" stroke-width="2"/><text x="605" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#a5560a">val fold5 = test代役</text>
    <!-- weight decision -->
    <text x="255" y="70" text-anchor="middle" font-size="12" fill="#26527d">この4foldだけで blend weight を決定</text>
    <path d="M255 74 L255 90 L605 90 L605 76" fill="none" stroke="#888" stroke-dasharray="4 3"/>
    <text x="605" y="104" text-anchor="middle" font-size="12" fill="#a5560a">決めた weight を val に適用 → 予測</text>
  </g>

  <!-- ===== (4) 3脚のリーク状態 & 結果 ===== -->
  <text x="30" y="694" font-size="17" font-weight="bold" fill="#0b5">④ 3脚のリーク状態と、正直な結果</text>
  <rect x="30" y="708" width="1000" height="162" rx="8" fill="#ffffff" stroke="#ccd"/>
  <text x="45" y="732" font-size="13.5" fill="#0a7d3a">✓ v90 : well-out-of-fold OOF（自井のラベル未使用）＝リークなし</text>
  <text x="45" y="756" font-size="13.5" fill="#0a7d3a">✓ snap: 各井の自GR×自typewellだけの per-well 推論＝リークなし（ただしGRは使う）</text>
  <text x="45" y="780" font-size="13.5" fill="#c0392b">✗ v74 : GRフリーだが well-CV が field指紋の過学習を隠す → CV 9.45 は楽観（実LB 10.94）</text>

  <line x1="45" y1="796" x2="1015" y2="796" stroke="#eee"/>
  <text x="45" y="820" font-size="14" font-weight="bold" fill="#1a1a2e">結果（v90 base 6.321 からの改善Δ）:</text>
  <rect x="45" y="830" width="300" height="30" rx="4" fill="#fdecea"/><text x="55" y="850" font-size="13" fill="#c0392b">固定w peek（リーク有）: −0.083 ← 楽観</text>
  <rect x="360" y="830" width="330" height="30" rx="4" fill="#f2fbf5"/><text x="370" y="850" font-size="13" fill="#0a7d3a">clean 5-fold（正）: −0.024〜−0.032</text>
  <rect x="705" y="830" width="310" height="30" rx="4" fill="#fff8e1"/><text x="715" y="850" font-size="12.5" fill="#8a6d00">±0.03 のばらつき＝ほぼ 0 と区別不能</text>

  <text x="530" y="890" text-anchor="middle" font-size="13" fill="#555">結論: 物理/GRフリー脚の実効利得は「不確実な −0.02 程度」。−0.083 は weight peek と v74 well-CV 楽観の産物だった。</text>
</svg>
