<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1000" width="1060" height="1000" font-family="system-ui,sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4a5568"/></marker></defs><rect x="0" y="0" width="1060" height="1000" fill="#ffffff"/><text x="530.0" y="20" font-size="16" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">v27 案B 提出パイプライン（self-prefix ＋ XY近傍, 挑戦構成）</text><rect x="390" y="28" width="280" height="58" rx="10" fill="#edf2f7" stroke="#2d3748" stroke-width="2"/><text x="530.0" y="52.5" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">INPUT: test坑井</text><text x="530.0" y="70.5" font-size="13" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">MD, X, Y, Z, GR, TVT_input  ＋ typewell</text><rect x="720" y="120" width="320" height="72" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/><text x="880.0" y="143.25" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">① XY近傍を train から選択</text><text x="880.0" y="159.75" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">重心距離: MAX_DIST=1500, 最大K=5</text><text x="880.0" y="176.25" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">近傍&lt;2本 → neighbor無し(その坑井はtwのみ)</text><line x1="530" y1="86" x2="530" y2="124" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><line x1="670" y1="57" x2="720" y2="150" stroke="#dd6b20" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><rect x="70" y="210" width="290" height="70" rx="10" fill="#eef2ff" stroke="#4c51bf" stroke-width="2"/><text x="215.0" y="240.5" font-size="12.5" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">② typewell grid</text><text x="215.0" y="258.0" font-size="12.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">typewell の GR(TVT)</text><rect x="385" y="210" width="290" height="70" rx="10" fill="#eef2ff" stroke="#4c51bf" stroke-width="2"/><text x="530.0" y="232.25" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">② self-prefix grid</text><text x="530.0" y="248.75" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">自分の既知prefix GR(TVT) を上書き</text><text x="530.0" y="265.25" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">(全坑井・近傍不要)</text><rect x="700" y="210" width="290" height="70" rx="10" fill="#eef2ff" stroke="#4c51bf" stroke-width="2"/><text x="845.0" y="232.25" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">② neighbor grid</text><text x="845.0" y="248.75" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">近傍train坑井の GR(TVT) を上書き</text><text x="845.0" y="265.25" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">(近傍あり坑井のみ)</text><line x1="530" y1="124" x2="530" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><line x1="530" y1="124" x2="215" y2="208" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><line x1="530" y1="124" x2="530" y2="208" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><line x1="530" y1="124" x2="845" y2="208" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><line x1="880" y1="192" x2="845" y2="210" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="70" y="330" width="290" height="66" rx="10" fill="#e6f0ff" stroke="#2b6cb0" stroke-width="2"/><text x="215.0" y="350.25" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">③ tw-PF</text><text x="215.0" y="366.75" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">PF = v25 r0 固定ラグ平滑</text><text x="215.0" y="383.25" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">lag192, n_seed=128, GPU</text><line x1="215" y1="280" x2="215" y2="330" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="385" y="330" width="290" height="66" rx="10" fill="#e6f0ff" stroke="#2b6cb0" stroke-width="2"/><text x="530.0" y="350.25" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">③ self-PF</text><text x="530.0" y="366.75" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">PF = v25 r0 固定ラグ平滑</text><text x="530.0" y="383.25" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">lag192, n_seed=128, GPU</text><line x1="530" y1="280" x2="530" y2="330" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="700" y="330" width="290" height="66" rx="10" fill="#e6f0ff" stroke="#2b6cb0" stroke-width="2"/><text x="845.0" y="350.25" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">③ nbr-PF</text><text x="845.0" y="366.75" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">PF = v25 r0 固定ラグ平滑</text><text x="845.0" y="383.25" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">lag192, n_seed=128, GPU</text><line x1="845" y1="280" x2="845" y2="330" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="150" y="452" width="760" height="72" rx="10" fill="#fff3cd" stroke="#b7791f" stroke-width="2"/><text x="530.0" y="475.0" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">④ 出力ブレンド (位置レベル)</text><text x="530.0" y="492.0" font-size="12" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">pos = tw-PF + A_SELF·(self−tw) + A_NBR·α_dist(近傍距離)·(nbr−tw)</text><text x="530.0" y="509.0" font-size="12" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">A_SELF = 0.55    A_NBR = 0.5 (×距離連動α)    ← 全坑井一律 / 近傍は近い坑井ほど強い</text><line x1="215" y1="396" x2="300" y2="452" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><line x1="530" y1="396" x2="530" y2="452" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><line x1="845" y1="396" x2="760" y2="452" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="572" width="250" height="60" rx="10" fill="#edf0f2" stroke="#a0aec0" stroke-width="2" stroke-dasharray="7 5"/><text x="185.0" y="597.5" font-size="12" font-weight="700" fill="#a0aec0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">beam  ✗ 無効(OFF)</text><text x="185.0" y="614.5" font-size="12" font-weight="400" fill="#a0aec0" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">GR相関デコード(挑戦構成で切る)</text><rect x="350" y="572" width="250" height="60" rx="10" fill="#d4f4dd" stroke="#2f855a" stroke-width="2"/><text x="475.0" y="597.5" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">hold  ✓ 有効(ON)</text><text x="475.0" y="614.5" font-size="12" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">last_known へ収縮(カテゴリ別)</text><rect x="640" y="572" width="250" height="60" rx="10" fill="#d4f4dd" stroke="#2f855a" stroke-width="2"/><text x="765.0" y="597.5" font-size="12" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">pp  ✓ 有効(ON)</text><text x="765.0" y="614.5" font-size="12" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">tauランプ + Savitzky-Golay平滑</text><line x1="530" y1="524" x2="530" y2="570" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><line x1="310" y1="602.0" x2="350" y2="602.0" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><line x1="600" y1="602.0" x2="640" y2="602.0" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="400" y="688" width="260" height="56" rx="10" fill="#e9d8fd" stroke="#6b46c1" stroke-width="2"/><text x="530.0" y="711.5" font-size="13" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">⑥ submission.csv</text><text x="530.0" y="729.5" font-size="13" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">test eval行の TVT 予測</text><line x1="765.0" y1="632" x2="530" y2="686" stroke="#4a5568" stroke-width="2" marker-end="url(#ah)"/><rect x="150" y="782" width="760" height="66" rx="10" fill="#f7fafc" stroke="#718096" stroke-width="2"/><text x="530.0" y="802.25" font-size="11.5" font-weight="700" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">■ 現在の提出構成 (案B・挑戦)</text><text x="530.0" y="818.75" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">PF: v25 r0 (n_seed=128, lag192, GPU)  |  self=全坑井(A_SELF0.55)  |  neighbor=近傍のみ(A_NBR0.5×距離α, MAX_DIST1500, ≥2本)</text><text x="530.0" y="835.25" font-size="11.5" font-weight="400" fill="#1a202c" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif">beam=OFF  hold=ON  pp=ON   ／ 近傍&lt;2本 or nn&gt;1500m の坑井は tw のみ(=現行相当)</text><rect x="150" y="872" width="24" height="16" rx="4" fill="#d4f4dd" stroke="#2f855a" stroke-width="2"/><text x="184" y="885" font-size="12" font-weight="400" fill="#718096" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">有効(ON)</text><rect x="300" y="872" width="24" height="16" rx="4" fill="#edf0f2" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 4"/><text x="334" y="885" font-size="12" font-weight="400" fill="#718096" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">無効(OFF)</text><text x="150" y="914" font-size="11" font-weight="400" fill="#a0aec0" text-anchor="start" font-family="system-ui,Segoe UI,sans-serif">※ train OOF は beam無しが最良だが LB実証は beam+hold+pp。これは train を根拠にした“挑戦”構成(LBで要確認)。</text></svg>