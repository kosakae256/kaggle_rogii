<text x="772" y="433" font-size="13" font-weight="700" fill="#5a2a0f">GBM ensemble</text>
<text x="772" y="449" font-size="10.7" fill="#465563">LGBM×n + CatBoost + XGB</text>
<text x="772" y="463" font-size="10.7" fill="#465563">→ Ridge stack, GroupKFold(5) OOF</text>
