<text x="772" y="513" font-size="13" font-weight="700" fill="#5a2a0f">PP  make_prediction (cell34)</text>
<text x="772" y="529" font-size="10.7" fill="#465563">w_sub1=0.6·GBM + 0.4·lik-PF</text>
<text x="772" y="543" font-size="10.7" fill="#465563">warmup ramp τ=85 + SG平滑</text>
<rect x="300" y="600" width="500" height="56" rx="9" fill="#fbe8ee" stroke="#b83280" stroke-width="1.6"/>
