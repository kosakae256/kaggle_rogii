<text x="132" y="357" font-size="10.7" fill="#465563">code = int(n_eval&gt;4840)</text>
<text x="132" y="371" font-size="10.7" fill="#465563">      + 2·searchsorted(z_span)</text>
<text x="132" y="385" font-size="10.7" fill="#465563">bin → variant: scale / beam / hold</text>
