<text x="312" y="707" font-size="13" font-weight="700" fill="#5c1740">Robust 多項式射影 (cell22)</text>
<text x="312" y="723" font-size="10.7" fill="#465563">per-well deg4 robust fit → 0.25·raw + 0.75·fit  (上書き)</text>
