<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1520" viewBox="0 0 1320 1520" font-family="Meiryo, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1320" height="1520" fill="#fbfbfd"/>
  <text x="660" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#1a1a2e">v93 パイプライン全体図 — v62 別表現スタッキング × 信頼できるGRフリー錨</text>
  <text x="660" y="56" text-anchor="middle" font-size="13" fill="#667">struct を全面GRフリー錨に置換(★=置換点)。create は5モジュールにクリーン再構築・回帰検証済</text>

  <!-- legend -->
  <g font-size="12">
    <rect x="24" y="70" width="16" height="12" fill="#e5f6ea" stroke="#4caf50"/><text x="46" y="80" fill="#333">検証済(v93 構築完了)</text>
    <rect x="210" y="70" width="16" height="12" fill="#fff6e0" stroke="#f0a020"/><text x="232" y="80" fill="#333">★GRフリー置換点</text>
    <rect x="392" y="70" width="16" height="12" fill="#fdf3f6" stroke="#c98"/><text x="414" y="80" fill="#333">未実装(次工程)</text>
    <rect x="560" y="70" width="16" height="12" fill="#eef2ff" stroke="#3a5bd5"/><text x="582" y="80" fill="#333">データ/成果物</text>
  </g>

  <!-- ============ A. 入力 ============ -->
  <text x="30" y="112" font-size="16" font-weight="bold" fill="#0b5">① 入力(全バージョン共通・test既知列のみ)</text>
  <g font-size="12.5">
    <rect x="40" y="122" width="270" height="58" rx="7" fill="#eef2ff" stroke="#3a5bd5"/>
    <text x="52" y="142" font-weight="bold" fill="#26386e">horizontal_well.csv</text>
    <text x="52" y="160" fill="#445">MD, X, Y, Z, GR, TVT_input</text>
    <text x="52" y="175" fill="#889">(既知prefix + 評価eval区間)</text>

    <rect x="330" y="122" width="230" height="58" rx="7" fill="#eef2ff" stroke="#3a5bd5"/>
    <text x="342" y="142" font-weight="bold" fill="#26386e">typewell.csv</text>
    <text x="342" y="160" fill="#445">TVT vs GR (参照縦坑)</text>
    <text x="342" y="175" fill="#889">→ 尤度の格子(gg)</text>

    <rect x="580" y="122" width="360" height="58" rx="7" fill="#fff6e0" stroke="#f0a020" stroke-width="2"/>
    <text x="592" y="142" font-weight="bold" fill="#a5560a">★ GRフリー錨  grfree_anchor_train.pkl</text>
    <text x="592" y="160" fill="#445">v91 OOF(val除外5fold・3seed) tvt + sig=9ft較正</text>
    <text x="592" y="175" fill="#889">LB 10.877(転移1.08) = struct代替の唯一位置prior</text>
  </g>

  <!-- ============ B. create_v93 (5 modules) ============ -->
  <rect x="24" y="200" width="1272" height="536" rx="10" fill="#ffffff" stroke="#cdd"/>
  <text x="40" y="224" font-size="16" font-weight="bold" fill="#0b5">② create_v93  (5モジュール・struct参照ゼロ)  →  train.parquet(722列)</text>

  <!-- module3 imputers -->
  <rect x="40" y="238" width="300" height="150" rx="8" fill="#e5f6ea" stroke="#4caf50"/>
  <text x="52" y="258" font-size="13.5" font-weight="bold" fill="#1c6b30">module3  imputers_v93</text>
  <rect x="52" y="266" width="276" height="40" rx="5" fill="#fff" stroke="#8bc79a"/>
  <text x="60" y="282" font-size="12" fill="#245">FormationPlaneKNN</text>
  <text x="60" y="298" font-size="11" fill="#678">XY→層深 局所平面fit(K=10, self除外)</text>
  <rect x="52" y="310" width="276" height="40" rx="5" fill="#fff" stroke="#8bc79a"/>
  <text x="60" y="326" font-size="12" fill="#245">DenseANCCImputer</text>
  <text x="60" y="342" font-size="11" fill="#678">XY-ANCC 密KNN(K=20, self除外)</text>
  <rect x="52" y="354" width="276" height="28" rx="5" fill="#fff" stroke="#8bc79a"/>
  <text x="60" y="372" font-size="11.5" fill="#245">近傍選択 neighbors_of(&lt;=1500ft, K&lt;=3)</text>

  <!-- module2 NN-emission -->
  <rect x="356" y="238" width="300" height="150" rx="8" fill="#e5f6ea" stroke="#4caf50"/>
  <text x="368" y="258" font-size="13.5" font-weight="bold" fill="#1c6b30">module2  nn_emission_v93</text>
  <rect x="368" y="266" width="276" height="52" rx="5" fill="#fff" stroke="#8bc79a"/>
  <text x="376" y="282" font-size="12" fill="#245">TCN encoder  Enc1D ×5fold(capaug)</text>
  <text x="376" y="297" font-size="11" fill="#678">8ch(horizontal) / 7ch(typewell) dilated conv</text>
  <text x="376" y="311" font-size="11" fill="#678">凍結再利用・OOF fold=wells[f::5]</text>
  <rect x="368" y="322" width="276" height="60" rx="5" fill="#fff6e0" stroke="#f0a020" stroke-width="2"/>
  <text x="376" y="338" font-size="12" font-weight="bold" fill="#a5560a">★ 候補帯中心 = GRフリー錨tvt</text>
  <text x="376" y="353" font-size="11" fill="#678">cosine類似 sim(±45ft, 0.5ft格子, 181)</text>
  <text x="376" y="368" font-size="11" fill="#678">Fh/Ft vs cacheA 乖離0.00 / NN寄与 -0.26</text>

  <!-- module1 pf banks -->
  <rect x="672" y="238" width="608" height="150" rx="8" fill="#e5f6ea" stroke="#4caf50"/>
  <text x="684" y="258" font-size="13.5" font-weight="bold" fill="#1c6b30">module1  pf_banks_v93  —  6バンク GPU固定ラグ平滑PF(lag16) × tw/self/nbr × n_seed32</text>
  <g font-size="11">
    <rect x="684" y="266" width="140" height="52" rx="5" fill="#fff" stroke="#8bc79a"/>
    <text x="692" y="282" font-size="12" fill="#245">pf_1 / pf_2 / pf_3</text>
    <text x="692" y="298" fill="#678">錨なし GR尤度PF</text>
    <text x="692" y="312" fill="#678">(v28 tuned, N=600)</text>

    <rect x="832" y="266" width="150" height="52" rx="5" fill="#fff" stroke="#8bc79a"/>
    <text x="840" y="282" font-size="12" fill="#245">r0_seed32 / r1_seed32</text>
    <text x="840" y="298" fill="#678">錨なし r0/r1 regime</text>
    <text x="840" y="312" fill="#678">(smoother, N=400)</text>

    <rect x="990" y="266" width="282" height="52" rx="5" fill="#fff6e0" stroke="#f0a020" stroke-width="2"/>
    <text x="998" y="282" font-size="12" font-weight="bold" fill="#a5560a">★ pfA = struct20(mult20) + GRフリー錨</text>
    <text x="998" y="298" fill="#678">位置錨 lka=exp(-½((v-anc)/(sig·mult))²)</text>
    <text x="998" y="312" fill="#678">旧: v38 mult30×struct → 差替。単体7.85</text>
  </g>
  <rect x="684" y="326" width="588" height="54" rx="5" fill="#f7fbf8" stroke="#bcdcc6"/>
  <text x="692" y="343" font-size="11.5" fill="#245">各バンク × 3表現:  tw(参照縦坑)  /  self(自分prefix疑似typewell)  /  nbr(近傍train疑似typewell)</text>
  <text x="692" y="360" font-size="11" fill="#678">尤度 = GR尤度 × phys × 錨(pfAのみ) × NN-emission(w_nn: pfA0.01 / 他0.02, GRフリー帯)</text>
  <text x="692" y="374" font-size="11" fill="#678">出力: 各井 eval行の 平滑平均mean / seed間std  (FWD_ENS / SELF_ENS / NBR_ENS)</text>

  <!-- module4 features -->
  <rect x="40" y="404" width="616" height="126" rx="8" fill="#e5f6ea" stroke="#4caf50"/>
  <text x="52" y="424" font-size="13.5" font-weight="bold" fill="#1c6b30">module4  features_v93 — build_well(v52 verbatim, PF/base特徴列)</text>
  <g font-size="11">
    <rect x="52" y="432" width="190" height="42" rx="5" fill="#fff" stroke="#8bc79a"/>
    <text x="60" y="448" font-size="11.5" fill="#245">PF特徴列(6バンク×tw/self/nbr)</text>
    <text x="60" y="463" fill="#678">pf_ancc/self/nbr, delta, tdpf, cross-bank</text>
    <rect x="250" y="432" width="190" height="42" rx="5" fill="#fff" stroke="#8bc79a"/>
    <text x="258" y="448" font-size="11.5" fill="#245">beam探索 / multi-scale NCC</text>
    <text x="258" y="463" fill="#678">GR↔typewell 整合(非PF)</text>
    <rect x="448" y="432" width="196" height="42" rx="5" fill="#fff" stroke="#8bc79a"/>
    <text x="456" y="448" font-size="11.5" fill="#245">formation/dense/GR形態/幾何</text>
    <text x="456" y="463" fill="#678">空間prior・GR morphology・cal/slp</text>
  </g>
  <text x="52" y="492" font-size="11" fill="#678">CPU PF(_pf_ancc/_pf_z/beam numba)・build_well は v52 と数値同一。tw平滑PFは FWD_ENS 経由注入(monkeypatch廃止)</text>
  <text x="52" y="512" font-size="11.5" fill="#1c6b30">回帰: 旧v52 6井 vs v93 6井 → PF/sig非依存 base 255列が厳密一致(バグ0)。差はPF由来のみ=struct→GRフリー</text>

  <!-- module5 create + parquet -->
  <rect x="672" y="404" width="608" height="126" rx="8" fill="#e5f6ea" stroke="#4caf50"/>
  <text x="684" y="424" font-size="13.5" font-weight="bold" fill="#1c6b30">module5  create_v93 — orchestration</text>
  <text x="684" y="444" font-size="11" fill="#678">18 GPUパス(tw/self/nbr×6バンク) → build_well 並列(joblib) → 連結</text>
  <text x="684" y="460" font-size="11" fill="#678">seed4423098 / N_SEED32 / chunk120 / sorted well順(v52同一)</text>
  <rect x="684" y="470" width="588" height="48" rx="6" fill="#eef2ff" stroke="#3a5bd5" stroke-width="2"/>
  <text x="692" y="490" font-size="13" font-weight="bold" fill="#26386e">→ v93/artifacts_v93/data/train.parquet</text>
  <text x="692" y="508" font-size="11.5" fill="#445">773井 × 722列 (target = TVT − last_known_tvt) ・ struct-free</text>

  <!-- ============ C. v62 L1-L7 ============ -->
  <rect x="24" y="756" width="1272" height="470" rx="10" fill="#ffffff" stroke="#cdd"/>
  <text x="40" y="780" font-size="16" font-weight="bold" fill="#b8860b">③ v62 別表現マルチスタック  L1–L7  (train.parquet を消費・未実装/次工程)</text>

  <!-- aux inputs -->
  <rect x="40" y="792" width="1240" height="34" rx="6" fill="#eef2ff" stroke="#3a5bd5"/>
  <text x="52" y="814" font-size="11.5" fill="#26386e">補助入力(要struct監査): gf_feature(v48 格子フィルタ) / v50b(v50 GR表現) / imagesR(v61 画像)  — struct焼込みならGRフリー版へ作替 or 除外</text>

  <!-- L1 GBM -->
  <rect x="40" y="838" width="392" height="176" rx="8" fill="#fdf3f6" stroke="#c98"/>
  <text x="52" y="858" font-size="13.5" font-weight="bold" fill="#8a4b5e">L1  タブラー GBM (バックボーン・最優先)</text>
  <text x="52" y="876" font-size="11" fill="#7a5">最も転移が素直 → 最初の v93 CV 判定</text>
  <g font-size="11.5">
    <rect x="52" y="886" width="118" height="50" rx="5" fill="#fff" stroke="#d3a"/>
    <text x="60" y="906" fill="#245" font-weight="bold">CatBoost ×3</text>
    <text x="60" y="924" font-size="10.5" fill="#678">forward seed</text>
    <rect x="180" y="886" width="118" height="50" rx="5" fill="#fff" stroke="#d3a"/>
    <text x="188" y="906" fill="#245" font-weight="bold">LightGBM ×3</text>
    <text x="188" y="924" font-size="10.5" fill="#678">forward seed</text>
    <rect x="308" y="886" width="116" height="50" rx="5" fill="#fff" stroke="#d3a"/>
    <text x="316" y="906" fill="#245" font-weight="bold">XGBoost ×3</text>
    <text x="316" y="924" font-size="10.5" fill="#678">forward seed</text>
  </g>
  <text x="52" y="958" font-size="11" fill="#678">clean CV(field-out / val除外5fold)。722列特徴を消費 → OOF誤差</text>
  <rect x="52" y="968" width="372" height="36" rx="5" fill="#fbeef2" stroke="#d9b"/>
  <text x="60" y="990" font-size="11.5" fill="#8a4b5e">③補助監査と並行。v62/v52 タブラーCVと比較 = GRフリー錨版の地力</text>

  <!-- NN legs L2-L7 -->
  <text x="452" y="858" font-size="13.5" font-weight="bold" fill="#8a4b5e">L2–L7  NN別表現脚 (3seed OOF, struct-free確認後)</text>
  <g font-size="11.5">
    <rect x="452" y="868" width="266" height="66" rx="6" fill="#fff" stroke="#c98"/>
    <text x="462" y="886" fill="#245" font-weight="bold">L2  TCN</text>
    <text x="462" y="903" font-size="10.5" fill="#678">per-well 時系列 TCN+attn</text>
    <text x="462" y="919" font-size="10.5" fill="#678">→ δ回帰(mdn)。スタック主脚(w0.4)</text>

    <rect x="726" y="868" width="266" height="66" rx="6" fill="#fff6e0" stroke="#f0a020" stroke-width="2"/>
    <text x="736" y="886" fill="#a5560a" font-weight="bold">L5  曲線トークン (cross-attention) ★柱</text>
    <text x="736" y="903" font-size="10.5" fill="#678">well-GR↔typewell-GR localize</text>
    <text x="736" y="919" font-size="10.5" fill="#678">v62で最強単脚(w0.775)。CV→LB要監視</text>

    <rect x="1000" y="868" width="280" height="66" rx="6" fill="#fff" stroke="#c98"/>
    <text x="1010" y="886" fill="#245" font-weight="bold">L3  画像 CNN</text>
    <text x="1010" y="903" font-size="10.5" fill="#678">δ×MD 証拠画像 → 2D CNN</text>
    <text x="1010" y="919" font-size="10.5" fill="#678">脱相関脚(w0.05)</text>

    <rect x="452" y="944" width="266" height="60" rx="6" fill="#fff" stroke="#c98"/>
    <text x="462" y="962" fill="#245" font-weight="bold">L4  再訪整合(revisit)</text>
    <text x="462" y="979" font-size="10.5" fill="#678">同一δ再訪の整合性特徴</text>
    <text x="462" y="995" font-size="10.5" fill="#678">補助脚</text>

    <rect x="726" y="944" width="266" height="60" rx="6" fill="#fff" stroke="#c98"/>
    <text x="736" y="962" fill="#245" font-weight="bold">L6  スペクトル</text>
    <text x="736" y="979" font-size="10.5" fill="#678">GR周波数表現</text>
    <text x="736" y="995" font-size="10.5" fill="#678">補助脚</text>

    <rect x="1000" y="944" width="280" height="60" rx="6" fill="#fff" stroke="#c98"/>
    <text x="1010" y="962" fill="#245" font-weight="bold">L7  ranking (RankNet系)</text>
    <text x="1010" y="979" font-size="10.5" fill="#678">候補順位付け学習</text>
    <text x="1010" y="995" font-size="10.5" fill="#678">補助脚</text>
  </g>

  <!-- ============ D. stack ============ -->
  <rect x="40" y="1042" width="1240" height="80" rx="8" fill="#f3eefc" stroke="#9b7cc9" stroke-width="2"/>
  <text x="52" y="1064" font-size="14" font-weight="bold" fill="#5e3b8a">④ 固定重みスタック  (train-fold で重み決定 → clean OOF blend)</text>
  <text x="52" y="1086" font-size="12.5" fill="#445">採用構成(v62): { L2 TCN 0.40,  L5 曲線トークン 0.775,  L3 画像 0.05 }  + L1 GBM ベース</text>
  <text x="52" y="1106" font-size="12" fill="#7a5">→ v93 CV を v62 の CV 5.8523 と比較。GRフリー錨で CV→LB 転移が改善するかが本丸。</text>

  <!-- ============ E. submit ============ -->
  <rect x="40" y="1142" width="1240" height="66" rx="8" fill="#fdf3f6" stroke="#c98"/>
  <text x="52" y="1164" font-size="14" font-weight="bold" fill="#8a4b5e">⑤ 提出</text>
  <text x="52" y="1184" font-size="12" fill="#445">test split で create_v93 実行 → ★test側 GRフリー錨(module2 test sim + test錨) → 同一パイプ推論 → LB</text>
  <text x="52" y="1201" font-size="11" fill="#678">test は隠し~200井に差替。test既知列(MD,X,Y,Z,GR,TVT_input+typewell)のみから特徴生成できることを担保済</text>

  <!-- arrows -->
  <g stroke="#555" stroke-width="1.6" fill="none">
    <path d="M175 180 L175 200" marker-end="url(#arw)"/>
    <path d="M445 180 L445 200" marker-end="url(#arw)"/>
    <path d="M760 180 L760 238" marker-end="url(#arw)"/>
    <!-- imputers/nn/pf -> features -->
    <path d="M190 388 L300 404" marker-end="url(#arw)"/>
    <path d="M506 388 L430 404" marker-end="url(#arw)"/>
    <path d="M976 388 L976 404" marker-end="url(#arw)" stroke-dasharray="5 3"/>
    <path d="M656 467 L672 467" marker-end="url(#arw)"/>
    <!-- parquet -> L1-L7 -->
    <path d="M978 518 L978 560 L660 560 L660 756" marker-end="url(#arw)"/>
    <!-- L1..L7 -> stack -->
    <path d="M236 1014 L236 1042" marker-end="url(#arw)"/>
    <path d="M585 1004 L585 1042" marker-end="url(#arw)"/>
    <path d="M859 1004 L859 1042" marker-end="url(#arw)"/>
    <path d="M1140 1004 L1140 1042" marker-end="url(#arw)"/>
    <!-- stack -> submit -->
    <path d="M660 1122 L660 1142" marker-end="url(#arw)"/>
  </g>

  <text x="660" y="1250" text-anchor="middle" font-size="12.5" fill="#555">凡例: ②create(緑)=構築・回帰検証済 / ③④⑤(黄・紫)=次工程 / ★(橙)=struct→GRフリー錨 置換点(pfA錨・NN-emission帯中心・test錨)</text>

  <!-- current status band -->
  <rect x="24" y="1276" width="1272" height="216" rx="10" fill="#ffffff" stroke="#cdd"/>
  <text x="40" y="1300" font-size="15" font-weight="bold" fill="#0b5">現在地と進行順</text>
  <g font-size="12.5">
    <text x="52" y="1326" fill="#1c6b30">✓ sigバグ修正(3seed std0.5→較正9ft): 全773井 pfA錨 7.85(錨なし9.02から −1.17)</text>
    <text x="52" y="1348" fill="#1c6b30">✓ create_v93 5モジュール構築 + 回帰検証(base255列一致・バグ0)</text>
    <text x="52" y="1370" fill="#8a6d00">▶ 今: create 全773井 実行中 → train.parquet 生成</text>
    <text x="52" y="1394" fill="#8a4b5e">① parquet健全性確認(773井/722列/target/NaN0)  →  ② L1 GBMバックボーン(最初のv93 CV)</text>
    <text x="52" y="1416" fill="#8a4b5e">③ 補助入力(gf/v50b/imagesR)の struct監査(②と並行・必須)</text>
    <text x="52" y="1438" fill="#8a4b5e">④ NN脚 L2 TCN / L5 曲線トークン / L3 画像 再構築(3seed OOF)  →  ⑤ 固定重みスタック(vs CV5.8523)</text>
    <text x="52" y="1460" fill="#8a4b5e">⑥ 提出(test GRフリー錨)</text>
    <text x="52" y="1482" font-size="11" fill="#889">規律: クリーン再構築 / 別バージョン実行時import禁止 / struct全面禁止 / 置換部は単体測定 / データはv93/artifacts</text>
  </g>
</svg>
